<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive rating component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body class="overpass-body">

    <div class="container">
      <img src="./images/icon-star.svg" alt />
      <h1 class="overpass-heading">How did we do?</h1>
      <p>
        Please let us know how we did with your support request. All feedback is
        appreciated to help us improve our offering!
      </p>

      <ul>
        <li><button type="button" class="btn">1</button></li>
        <li><button type="button" class="btn">2</button></li>
        <li><button type="button" class="btn">3</button></li>
        <li><button type="button" class="btn">4</button></li>
        <li><button type="button" class="btn">5</button></li>
      </ul>

      <button class="btn-submit" id="submit-rating"
        type="button">Submit</button>
    </div>

    <div class="thank-you hidden">
      <img src="./images/illustration-thank-you.svg" alt />
      <p class="gray">
        You selected <span id="rating"> 1 </span> out of 5
      </p>

      <h2 class="overpass-heading">Thank you!</h2>

      <p>
        We appreciate you taking the time to give a rating. If you ever need
        more support, don’t hesitate to get in touch!
      </p>

      <button class="btn-submit" id="rate-again" type="button">Rate
        Again</button>
    </div>

  </body>
</html>
